# Publishes to npm and creates a GitHub release when a version tag is pushed.
# Inert until a v* tag exists and NPM_TOKEN is set as a repository secret.
name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - run: npm test
      - name: publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
